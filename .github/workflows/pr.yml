name: PR

# One job for the whole repo, and no `paths:` filter.
#
# The monorepo this came from splits its gates per package and guards each one
# with a changed-paths filter, because a required status check must report on
# every PR there and an unrelated PR should still be cheap. Neither pressure
# exists here: there are two packages, they share a toolchain, the token
# generator writes across both, and the entire suite runs in well under a
# minute. Splitting it would buy nothing and add a way for a PR that changes
# tokens to skip the design system's tests.
on:
  pull_request:
  # `main` too, so a merge that somehow lands red is visible on the branch
  # rather than only in the publish job's fallout.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the version gate below diffs against the PR base.
          fetch-depth: 0

      # Must match the root package.json's `engines.node` (">=24").
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # `ci`, never `install`: the lockfile is committed precisely so CI
      # resolves the same tree twice running, and `ci` fails loudly when
      # package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      # Version-bump gate, before anything expensive — a PR that forgot the
      # bump should be told so in fifteen seconds, not after the test suite.
      #
      # Both packages publish on merge to main, and the publish job is
      # idempotent BY VERSION: it skips cleanly when the manifest's version is
      # already in the registry. So an unbumped package change merges green,
      # publishes nothing, and leaves the registry silently stale — the
      # consuming repo would keep installing the old artifact with no error
      # anywhere. This step is the only thing standing between that and a
      # release.
      - name: Require a version bump for every changed package
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Fail loudly if the base COMMIT is missing rather than treating an
          # unreadable base as "nothing changed" — a guard that cannot see the
          # diff must not wave the PR through.
          git cat-file -e "$BASE_SHA^{commit}"

          failed=0
          for pkg_dir in packages/*/; do
            pkg_dir="${pkg_dir%/}"
            manifest="$pkg_dir/package.json"

            if git diff --quiet "$BASE_SHA" HEAD -- "$pkg_dir"; then
              echo "· $pkg_dir — unchanged."
              continue
            fi

            # A missing blob at base means this PR introduces the package. A
            # first version is a version change by definition.
            if ! git cat-file -e "$BASE_SHA:$manifest" 2>/dev/null; then
              echo "· $pkg_dir — introduced by this PR; nothing to compare."
              continue
            fi

            base_pkg="$(git show "$BASE_SHA:$manifest")"
            base_version="$(node -p 'JSON.parse(process.argv[1]).version' "$base_pkg")"
            head_version="$(node -p "require('./$manifest').version")"

            if [ "$head_version" = "$base_version" ]; then
              echo "::error file=$manifest::This PR changes $pkg_dir/ but leaves version at $base_version. Both packages publish on merge to main; bump \`version\` — the consuming repo installs the published artifact, so an unbumped change ships nothing."
              failed=1
            else
              echo "· $pkg_dir — $base_version -> $head_version."
            fi
          done

          exit "$failed"

      # The same gate for the agent-skills plugin, which is versioned
      # independently of the packages — it lives outside packages/ precisely so
      # that a wording fix in a skill does not publish a component release.
      #
      # Marketplace consumers only receive an update when this string changes,
      # and the plugin has THREE manifests (Claude, Codex, Cursor) that must
      # agree. `npm run skills:check` below checks that they agree; this checks
      # that a change moved them at all.
      - name: Require a version bump when the plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git cat-file -e "$BASE_SHA^{commit}"

          manifest="plugins/design-system/.claude-plugin/plugin.json"

          if git diff --quiet "$BASE_SHA" HEAD -- plugins/; then
            echo "· plugins/ — unchanged."
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA:$manifest" 2>/dev/null; then
            echo "· plugins/ — introduced by this PR; nothing to compare."
            exit 0
          fi

          base_pkg="$(git show "$BASE_SHA:$manifest")"
          base_version="$(node -p 'JSON.parse(process.argv[1]).version' "$base_pkg")"
          head_version="$(node -p "require('./$manifest').version")"

          if [ "$head_version" = "$base_version" ]; then
            echo "::error file=$manifest::This PR changes plugins/ but leaves the plugin at $base_version. Installed plugins update only when this version changes, so an unbumped skill edit reaches nobody. Bump it in all three manifests."
            exit 1
          fi

          echo "· plugins/ — $base_version -> $head_version."

      # Every SKILL.md in the repo: audience prefix, description and body
      # limits, name matching its directory, and the three plugin manifests
      # agreeing on a version. Dependency-free and instant, so it sits with the
      # other cheap gates rather than after the suite.
      - name: Skill checks
        run: npm run skills:check

      # Before lint/typecheck/test, for the honest failure: if someone
      # hand-edited a generated file, the error should say "you edited the
      # wrong file", not surface as a downstream complaint about the edit.
      - name: Token drift check
        run: npm run tokens:check

      # Via each package's own script, not `npx eslint` from the root: there is
      # deliberately no `eslint.config.js` at the repo root (see
      # eslint.base.js), so ESLint with the root as its cwd would find no
      # config at all.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      # Granular rather than the root `typecheck` fan-out, so a red X says
      # WHICH platform broke. The native program is the one this web-only CI
      # would otherwise never exercise: without it a PR could be green
      # everywhere and still ship `.native` leaves that fail the moment Metro
      # resolves them.
      - name: Typecheck (tokens)
        run: npm run typecheck --workspace @insolvia-ai/tokens

      - name: Typecheck (design system, web)
        run: npm run typecheck:web --workspace @insolvia-ai/design-system

      - name: Typecheck (design system, native)
        run: npm run typecheck:native --workspace @insolvia-ai/design-system

      - name: Typecheck (design system, native tests)
        run: npm run typecheck:native-test --workspace @insolvia-ai/design-system

      # The fourth program: the workbench stories. They are outside every
      # tsconfig the packages own, so until 0.8.3 nothing typechecked them and
      # the Button story rendered `intent="danger"` — an intent that does not
      # exist — as an unstyled button labelled "danger". The a11y step below
      # cannot see that (an unstyled button violates no axe rule) and
      # "Workbench builds" cannot either (it transpiles, it does not check
      # types). See tsconfig.workbench.json.
      - name: Typecheck (workbench stories)
        run: npm run typecheck:workbench

      # The fifth program: scripts/. A gate script nobody typechecks is a gate
      # that can silently stop gating — the same failure the workbench program
      # above was added to fix. See tsconfig.scripts.json.
      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: Test
        run: npm run test

      # The workbench is the only place in this repo where a component is
      # LOOKED AT rather than asserted about — `.storybook/main.ts` says so
      # directly, and it's what the a11y step below actually exercises: every
      # story, in a real browser, with a real accessibility tree. A component
      # with no story is invisible to that check, and to a human, at once —
      # twenty of this package's twenty-two components shipped that way before
      # anything caught it. This runs `workbench/story-coverage.test.ts` under
      # plain Node (no browser needed, so it runs before the Playwright install
      # below rather than after) and fails with the exact missing path.
      - name: Workbench story coverage
        run: npm run test:workbench

      # Accessibility, gated rather than reported.
      #
      # Runs every story as a test in a real Chromium and fails on any axe
      # violation (`a11y.test: 'error'` in .storybook/preview.tsx). This is the
      # only check in the repo that sees computed styles and a real
      # accessibility tree — colour contrast and target size do not exist under
      # jsdom, where the rest of the suite lives — so it catches a class of
      # defect the 348 unit tests structurally cannot.
      #
      # Playwright's browser download is the slowest step here by far, hence
      # `--only-shell`: the story tests need Chromium's headless shell and none
      # of the rest.
      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --only-shell --with-deps

      - name: Accessibility (axe, every story)
        run: npm run test:a11y

      # The workbench is not tested, but it must still COMPILE.
      #
      # It is the only place either repo can see a component, and it breaks in
      # a way nothing else notices: it reaches past the packages' `exports` into
      # their source, so a moved or renamed file leaves every other check green
      # and the workbench dead. The person who finds out is whoever next needs
      # to look at a component, usually while debugging something else.
      #
      # A build, not a smoke test — it type-checks nothing (the stories are
      # outside every tsconfig program) but it does resolve every import and
      # compile every story, which is the failure being guarded.
      - name: Workbench builds
        run: npm run storybook:build

      # The platform-split invariant, machine-checked against the artifact that
      # actually ships rather than against the working tree.
      #
      # `npm pack` applies `files`, so this catches two failures the tests
      # cannot: a `.web`/`.native` pair that got collapsed (someone added a
      # build step), and test files leaking into the tarball. Both are silent
      # in every other check and only surface in a consumer's bundler.
      - name: Packaged artifact keeps the platform split
        run: |
          set -euo pipefail
          cd packages/design-system
          files="$(npm pack --dry-run --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const [pkg] = JSON.parse(s);
              for (const f of pkg.files) console.log(f.path);
            });
          ')"

          web="$(printf "%s\n" "$files" | grep -c "\.web\.tsx$" || true)"
          native="$(printf "%s\n" "$files" | grep -c "\.native\.tsx$" || true)"
          tests="$(printf "%s\n" "$files" | grep -Ec "\.test\.tsx?$" || true)"

          echo "web leaves: $web · native leaves: $native · test files: $tests"

          if [ "$web" -eq 0 ] || [ "$native" -eq 0 ]; then
            echo "::error::The packed tarball is missing a platform leaf ($web web, $native native). This package publishes SOURCE so the consumer's bundler can pick the leaf; a build step that collapses the pair breaks resolution for every consumer."
            exit 1
          fi

          if [ "$tests" -ne 0 ]; then
            echo "::error::$tests test file(s) leaked into the tarball. Check the \`files\` negations in package.json."
            exit 1
          fi
